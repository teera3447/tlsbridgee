plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tlsbridge'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tlsbridge'
        // Android 4.0 (Ice Cream Sandwich). If your Gradle/AGP rejects this value, raise it to 16 or 21.
        minSdk 14
        // 28 keeps the foreground-service rules simple while still installing on current Android versions.
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Modern TLS (BoringSSL, TLS 1.3) bundled with the app, works without Google Play services.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // Last OkHttp line that still supports old Android (3.12.x = API 9+). OkHttp 4+ needs API 21.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}

// Fetch the Mozilla CA bundle at build time so expired roots on old devices do not break TLS.
def caFile = file('src/main/assets/cacert.pem')
tasks.register('fetchCaBundle') {
    outputs.file(caFile)
    outputs.upToDateWhen { caFile.exists() }
    doLast {
        if (!caFile.exists()) {
            caFile.parentFile.mkdirs()
            try {
                new URL('https://curl.se/ca/cacert.pem').withInputStream { i ->
                    caFile.withOutputStream { o -> o << i }
                }
                logger.lifecycle('Downloaded CA bundle to ' + caFile)
            } catch (Exception e) {
                logger.warn('Could not download the CA bundle (' + e.message + '). ' +
                        'Download https://curl.se/ca/cacert.pem and place it in app/src/main/assets/cacert.pem')
            }
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'fetchCaBundle' }
